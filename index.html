<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#141a20" />
<meta name="description" content="《诛仙》江湖录——按萧鼎原著剧情做的单机 MMORPG。四大门派、十二张场景、打怪练级穿装备，浏览器直接玩，可装到手机主屏离线运行。" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="诛仙" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<link rel="stylesheet" href="./styles.css" />
<title>诛仙 · 江湖录</title>
</head>
<body>

<!-- 标题页：选门派、起名。
     整页当一张四尺整纸来排：上方大片留白，远山压在下三分之一，
     题字在上首、朱印在题字右下——就是国画款识的老位置。 -->
<div id="title">

  <!-- 纯装饰的水墨层。远山三重、一轮淡月、山间水气、三只飞鸟，
       全是内联 SVG + CSS 现画，不引任何图片文件 -->
  <div class="ink-scene" aria-hidden="true">
    <div class="ink-moon"></div>

    <svg class="ink-mountains" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax meet">
      <!-- 通天峰：一座远得发灰的孤峰，全图的最高处 -->
      <path class="mt-peak" d="M640 520C700 430 720 330 762 154 800 320 828 420 890 520Z" />
      <!-- 侧峰：陪着主峰，免得孤峰太像一个三角形 -->
      <path class="mt-peak2" d="M916 520C956 448 972 372 1002 246 1030 360 1050 440 1092 520Z" />
      <!-- 远山：碎、低、糊 -->
      <path class="mt-far" d="M0 300 70 252 118 286 186 206 242 262 300 232 362 288 430 238 498 292 560 246 628 300 700 244 768 296 840 250 910 302 982 254 1060 306 1130 262 1200 308V520H0Z" />
      <ellipse class="mt-mist" cx="880" cy="312" rx="320" ry="18" />
      <!-- 中景：连绵的缓坡 -->
      <path class="mt-mid" d="M0 372C70 336 128 356 196 322 262 290 316 336 388 322 458 308 512 356 592 342 672 328 730 290 812 326 892 362 952 334 1032 356 1112 378 1156 362 1200 374V520H0Z" />
      <ellipse class="mt-mist" cx="320" cy="368" rx="380" ry="22" />
      <!-- 近景：最重的一笔压在左下，把画面撑住 -->
      <path class="mt-near" d="M0 470C52 452 92 412 142 378 186 348 206 300 250 258 286 224 312 262 342 300 382 350 428 392 484 420 540 448 584 468 648 480 712 492 760 496 820 502 880 508 940 500 1010 496 1080 492 1140 502 1200 496V520H0Z" />
      <ellipse class="mt-mist" cx="600" cy="452" rx="460" ry="24" />
    </svg>

    <div class="ink-mist"></div>

    <svg class="ink-birds" viewBox="0 0 120 40">
      <g fill="none" stroke="#c3cbcf" stroke-linecap="round">
        <path d="M6 14Q12 8 18 13Q24 8 30 14" stroke-width="1.8" />
        <path d="M44 24Q49 19 54 23Q59 19 64 24" stroke-width="1.5" />
        <path d="M80 9Q84 5 88 8.5Q92 5 96 9" stroke-width="1.2" />
      </g>
    </svg>
  </div>

  <div class="title-inner">
    <div class="title-brand">
      <h1 class="game-title">诛仙</h1>
      <span class="seal" aria-hidden="true">江湖录</span>
    </div>
    <p class="game-sub">单机 MMORPG</p>
    <p class="game-quote">天地不仁，以万物为刍狗。</p>

    <div class="name-row">
      <label for="name-input">道号</label>
      <input id="name-input" type="text" maxlength="12" placeholder="张小凡" autocomplete="off" />
    </div>

    <p class="pick-hint">择一门派入道。门派决定体格、法术与专属兵器，入门后不可更改。</p>
    <div id="sect-list" class="sect-list"></div>

    <div class="title-btns">
      <button id="btn-continue" class="btn big hidden"></button>
      <button id="btn-new" class="btn big primary">入　道</button>
    </div>

    <p class="title-foot">
      键鼠：WASD 移动 · 鼠标瞄准 · 左键/空格 普攻 · 1-6 技能 · Q 法宝 · E 交互 · R 吃药 · B 背包 · Esc 菜单<br />
      触屏：左半屏按住出摇杆，右下角点技能
    </p>
  </div>
</div>

<canvas id="game" class="hidden"></canvas>

<!-- 主界面 -->
<div id="hud" class="hidden">

  <!-- 左上：身份与血蓝 -->
  <div class="hud-left">
    <div class="hud-id">
      <div class="portrait">
        <span id="lvl">1</span>
      </div>
      <div class="vitals">
        <div class="who"><b id="pname">无名</b><i id="psect">青云门</i></div>
        <div class="bar hp"><span id="hp-fill" class="fill"></span><em id="hp-text"></em></div>
        <div class="bar mp"><span id="mp-fill" class="fill"></span><em id="mp-text"></em></div>
        <div id="buffs" class="buffs"></div>
      </div>
    </div>

    <!-- 按钮挪到左边并放大：右边原先挤在小地图下面，一排两三个 tiny 按钮，
         手指根本点不准。左边这块除了血条本来就是空的 -->
    <div class="hud-btns">
      <button class="btn" data-action="bag">背包</button>
      <button class="btn" data-action="char">角色</button>
      <button class="btn" data-action="skills">技能</button>
      <button class="btn" data-action="quest">任务</button>
      <button class="btn" data-action="map">山河</button>
      <button class="btn" data-action="menu">菜单</button>
    </div>
  </div>

  <!-- 右上：地图名、小地图、按钮 -->
  <div class="hud-right">
    <div class="map-head">
      <div id="map-name">草庙村</div>
      <div id="map-sub"></div>
    </div>
    <canvas id="minimap" width="180" height="140"></canvas>
    <div class="gold-row">灵石 <b id="gold">0</b></div>

    <!-- 任务追踪跟在小地图这一列里，让它随上面的内容自然下移，
         不要用写死的 top 偏移——按钮一换行就会压到一起 -->
    <div id="quest-track" class="quest-track"></div>
  </div>

  <!-- Boss 血条。占顶部通栏，出现时把左右两栏一起往下挤（见 .boss-on） -->
  <div id="bossbar" class="bossbar hidden">
    <div id="boss-name"></div>
    <div class="bar boss"><span id="boss-fill" class="fill"></span><em id="boss-text"></em></div>
  </div>

  <!-- 左下：日志 -->
  <div id="log" class="log"></div>

  <!-- 底部：经验条 + 技能栏 -->
  <div class="hud-bottom">
    <div class="bar exp"><span id="exp-fill" class="fill"></span><em id="exp-text"></em></div>
    <div id="skillbar" class="skillbar"></div>
  </div>

  <!-- 触屏圆钮钉在屏幕右下角，所以不能放在 .hud-bottom 里面：
       那个容器带 transform，会成为 position: fixed 的包含块，
       按钮就变成相对居中的底栏定位，贴不到屏幕角上 -->
  <!-- 没有「攻」：怪一进近身范围就会自动普攻，这个键按了也是多余的 -->
  <div class="touch-btns">
    <button class="btn round" data-action="interact">E</button>
    <button class="btn round" data-action="potion">药</button>
  </div>
</div>

<!-- 通用面板 -->
<div id="panel" class="panel hidden">
  <div class="panel-box">
    <div class="panel-head">
      <span id="panel-title"></span>
      <button id="panel-close" class="btn tiny">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </div>
</div>

<!-- NPC 对话 -->
<div id="dialog" class="dialog hidden"></div>

<!-- 物品详情。背包格子多，详情若跟在网格后面会被挤出屏幕，所以独立成弹窗 -->
<div id="itempop" class="itempop hidden"></div>

<div id="toast" class="toast"></div>

<script src="./src/config.js"></script>
<script src="./src/util.js"></script>
<script src="./src/stats.js"></script>
<script src="./src/data/sects.js"></script>
<script src="./src/data/items.js"></script>
<script src="./src/data/monsters.js"></script>
<script src="./src/data/maps.js"></script>
<script src="./src/data/npcs.js"></script>
<script src="./src/data/quests.js"></script>
<script src="./src/inventory.js"></script>
<script src="./src/player.js"></script>
<script src="./src/combat.js"></script>
<script src="./src/world.js"></script>
<script src="./src/skills.js"></script>
<script src="./src/quest.js"></script>
<script src="./src/save.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/art.js"></script>
<script src="./src/art-actors.js"></script>
<script src="./src/render.js"></script>
<script src="./src/input.js"></script>
<script src="./src/ui.js"></script>
<script src="./src/ui-panels.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
